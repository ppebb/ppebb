			<g transform="translate(0, 100)">
				<g class="stagger" style="animation-delay: 1950ms">
					<circle r="4" cx="31" cy="31" fill="#6E4C13" />
					<text data-testid="lang-name" x="51" y="32" class="lang-name">Unix Assembly</text>
