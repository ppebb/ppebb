					 <text x="183" y="32" class="lang-count">24340 lines</text> 
					<text x="227" y="32" class="lang-perc">12.74%</text>
				</g>
			</g>
			<rect mask="url(#rect-mask)" x="244" y="0" width="52" height="8" fill="#f34b7d" />
