			<g transform="translate(228, 100)">
				<g class="stagger" style="animation-delay: 2100ms">
					<circle r="4" cx="31" cy="31" fill="#3D6117" />
					<text data-testid="lang-name" x="51" y="32" class="lang-name">TeX</text>
					 <text x="183" y="32" class="lang-count">2369 lines</text> 
